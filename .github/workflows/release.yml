name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Semantic version bump to apply
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Manual release
    runs-on:
      - self-hosted
      - macOS
      - X64
    environment: release
    env:
      BUILD_DIR: ${{ github.workspace }}/build/release
      DIST_DIR: ${{ github.workspace }}/dist
    steps:
      - name: Validate release context
        env:
          EXPECTED_REF: refs/heads/main
          EXPECTED_REPOSITORY: utsmannn/notatod
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "${EXPECTED_REF}" ]]; then
            echo "Release workflow only runs from ${EXPECTED_REF}, got ${GITHUB_REF}." >&2
            exit 1
          fi

          if [[ "${GITHUB_REPOSITORY}" != "${EXPECTED_REPOSITORY}" ]]; then
            echo "Release workflow only runs for ${EXPECTED_REPOSITORY}, got ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi

          if [[ "${GITHUB_ACTOR}" == "github-actions[bot]" ]]; then
            echo "Release workflow must be started by a human actor." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local commit.gpgsign false

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Materialize sync secrets plist
        env:
          SYNC_SECRETS_PLIST_B64: ${{ secrets.SYNC_SECRETS_PLIST_B64 }}
        run: |
          set -euo pipefail

          if [[ -z "${SYNC_SECRETS_PLIST_B64}" ]]; then
            echo "SYNC_SECRETS_PLIST_B64 is not configured." >&2
            exit 1
          fi

          mkdir -p Notatod/Config
          printf '%s' "${SYNC_SECRETS_PLIST_B64}" | base64 --decode > Notatod/Config/SyncSecrets.plist

      - name: Bump release version
        id: version
        run: |
          set -euo pipefail

          version_output="$(./scripts/release-version.sh "${{ inputs.bump_type }}" --write)"
          printf '%s\n' "$version_output"
          printf '%s\n' "$version_output" >> "$GITHUB_OUTPUT"

      - name: Regenerate Xcode project
        run: xcodegen generate

      - name: Verify release diff scope
        run: |
          set -euo pipefail

          allowed_files=(
            "Notatod.xcodeproj/project.pbxproj"
            "Notatod/Info.plist"
            "project.yml"
          )

          changed_files="$(git diff --name-only)"

          if [[ -z "$changed_files" ]]; then
            echo "Release bump produced no changes." >&2
            exit 1
          fi

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            allowed=false
            for allowed_file in "${allowed_files[@]}"; do
              if [[ "$file" == "$allowed_file" ]]; then
                allowed=true
                break
              fi
            done

            if [[ "$allowed" != true ]]; then
              echo "Unexpected release diff: $file" >&2
              exit 1
            fi
          done <<< "$changed_files"

      - name: Build app
        run: |
          set -euo pipefail

          rm -rf "$BUILD_DIR" "$DIST_DIR"
          mkdir -p "$BUILD_DIR" "$DIST_DIR"

          xcodebuild build \
            -scheme Notatod \
            -project Notatod.xcodeproj \
            -configuration Release \
            -derivedDataPath "$BUILD_DIR/DerivedData"

      - name: Run release tests
        run: xcodebuild test -scheme Notatod -project Notatod.xcodeproj -only-testing:NotatodTests

      - name: Package DMG
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.NEXT_VERSION }}"
          app_path="$BUILD_DIR/DerivedData/Build/Products/Release/Notatod.app"
          stage_dir="$BUILD_DIR/dmg-root"
          dmg_path="$DIST_DIR/Notatod-v${version}.dmg"

          if [[ ! -d "$app_path" ]]; then
            echo "Built app not found at $app_path" >&2
            exit 1
          fi

          rm -rf "$stage_dir" "$dmg_path"
          mkdir -p "$stage_dir"
          cp -R "$app_path" "$stage_dir/"

          hdiutil create \
            -volname "Notatod" \
            -srcfolder "$stage_dir" \
            -ov \
            -format UDZO \
            "$dmg_path"

      - name: Commit release bump
        run: |
          set -euo pipefail

          git add project.yml Notatod/Info.plist Notatod.xcodeproj/project.pbxproj
          git commit -m "chore(release): v${{ steps.version.outputs.NEXT_VERSION }}"

      - name: Create annotated tag
        run: |
          set -euo pipefail

          tag_name="v${{ steps.version.outputs.NEXT_VERSION }}"

          if git rev-parse "refs/tags/${tag_name}" >/dev/null 2>&1; then
            git tag -d "${tag_name}"
          fi

          git tag -a "${tag_name}" -m "Release ${tag_name}"

      - name: Push release commit and tag
        run: |
          git push origin main
          git push origin "v${{ steps.version.outputs.NEXT_VERSION }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.NEXT_VERSION }}"
          dmg_path="$DIST_DIR/Notatod-v${version}.dmg"

          if [[ ! -f "$dmg_path" ]]; then
            echo "DMG asset not found at $dmg_path" >&2
            exit 1
          fi

          gh release create "v${version}" \
            "$dmg_path" \
            --target main \
            --title "v${version}" \
            --generate-notes

      - name: Remove materialized sync secrets plist
        if: always()
        run: rm -f Notatod/Config/SyncSecrets.plist
